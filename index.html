<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>エレメントクエスト - 元素を当てろ！</title>
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 浮遊パーティクル -->
  <div class="floating-particles" id="floating-particles" aria-hidden="true"></div>

  <!-- タイトル画面 -->
  <div id="screen-title" class="screen active">
    <div class="title-container">
      <div class="title-logo-area">
        <div class="title-atom" aria-hidden="true">
          <div class="atom-nucleus"></div>
          <div class="atom-orbit atom-orbit-1"><div class="atom-electron"></div></div>
          <div class="atom-orbit atom-orbit-2"><div class="atom-electron"></div></div>
          <div class="atom-orbit atom-orbit-3"><div class="atom-electron"></div></div>
        </div>
        <h1 class="game-title">ELEMENT QUEST</h1>
        <p class="game-title-jp">エレメントクエスト</p>
      </div>
      <p class="title-subtitle">元素を当てろ！ 全39ステージ × 117元素</p>
      <div class="title-buttons">
        <button class="btn btn-primary btn-large btn-glow" onclick="GameUI.showStageSelect()">ゲームスタート</button>
        <button class="btn btn-glass btn-large" onclick="GameUI.showZukan()">図鑑</button>
      </div>
      <div id="title-progress" class="title-progress"></div>
    </div>
  </div>

  <!-- ステージ選択（冒険マップ） -->
  <div id="screen-stage-select" class="screen">
    <div class="map-header">
      <h2 class="map-title">冒険マップ</h2>
      <p class="map-subtitle">全問正解でパーフェクト！</p>
    </div>
    <div class="map-nav-buttons">
      <button class="btn btn-gold btn-nav" onclick="GameUI.showZukan()">
        <span class="nav-icon">📖</span> 元素図鑑 <span class="nav-badge" id="nav-zukan-count">0/118</span>
      </button>
      <button class="btn btn-glass btn-nav" onclick="GameUI.showTitle()">
        <span class="nav-icon">🏠</span> タイトルへ
      </button>
    </div>
    <div class="stage-list" id="stage-grid"></div>
  </div>

  <!-- クイズ画面 -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-top-bar">
      <button class="btn btn-back" onclick="GameUI.confirmQuit()">✕</button>
      <h2 id="quiz-stage-title" class="quiz-stage-name"></h2>
      <div class="quiz-progress" id="quiz-progress"></div>
    </div>
    <div class="quiz-container">
      <div class="quiz-element-progress" id="quiz-element-progress"></div>
      <div class="hint-area" id="hint-area"></div>
      <div class="answer-area" id="answer-area"></div>
    </div>
  </div>

  <!-- カード獲得演出 -->
  <div id="screen-card-get" class="screen">
    <div class="card-get-container">
      <div class="card-get-flash"></div>
      <p class="card-get-label" id="card-get-label">元素カード獲得！</p>
      <div class="card-get-cards" id="card-get-display"></div>
      <div class="card-get-buttons" id="card-get-buttons"></div>
    </div>
  </div>

  <!-- ステージ結果画面 -->
  <div id="screen-result" class="screen">
    <div class="result-container">
      <h2 id="result-title"></h2>
      <div class="result-score" id="result-score"></div>
      <div class="result-cards" id="result-cards"></div>
      <div class="result-buttons" id="result-buttons"></div>
    </div>
  </div>

  <!-- 図鑑画面 -->
  <div id="screen-zukan" class="screen">
    <div class="screen-header">
      <button class="btn btn-back" onclick="GameUI.showStageSelect()">← もどる</button>
      <h2>元素図鑑</h2>
      <div class="zukan-count" id="zukan-count"></div>
    </div>
    <div class="zukan-toggle">
      <button class="btn btn-secondary active" id="btn-grid-view" onclick="GameUI.switchZukanView('grid')">一覧</button>
      <button class="btn btn-secondary" id="btn-periodic-view" onclick="GameUI.switchZukanView('periodic')">周期表</button>
    </div>
    <div class="zukan-grid" id="zukan-grid"></div>
    <div class="zukan-periodic-wrapper" id="zukan-periodic" style="display:none"></div>
  </div>

  <!-- 118番ボーナス演出 -->
  <div id="screen-bonus" class="screen">
    <div class="bonus-container">
      <div class="bonus-particles" id="bonus-particles"></div>
      <h2 class="bonus-title">全ステージ制覇！</h2>
      <p class="bonus-subtitle">特別な元素カードを獲得しました</p>
      <div class="bonus-card" id="bonus-card-display"></div>
      <p class="bonus-element-name">No.118 オガネソン (Og)</p>
      <p class="bonus-message">おめでとう！すべての元素をマスターしました！</p>
      <button class="btn btn-primary btn-large" onclick="GameUI.showZukan()">図鑑を見る</button>
    </div>
  </div>

  <!-- 確認ダイアログ -->
  <div id="dialog-overlay" class="dialog-overlay" style="display:none">
    <div class="dialog-box">
      <p id="dialog-message"></p>
      <div class="dialog-buttons">
        <button class="btn btn-secondary" id="dialog-cancel">キャンセル</button>
        <button class="btn btn-primary" id="dialog-ok">OK</button>
      </div>
    </div>
  </div>

  <script src="data/elements-part1.js"></script>
  <script src="data/elements-part2.js"></script>
  <script src="data/elements-part3.js"></script>
  <script src="data/elements.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
